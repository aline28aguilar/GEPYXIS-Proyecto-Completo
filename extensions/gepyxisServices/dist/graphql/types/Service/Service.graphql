"""
Representa un servicio ofrecido por GEPYXIS.
"""
type Service {
  serviceId: Int!
  uuid: String!
  deleteApi: String!
  name: String!
  description: String!
  image: String
  priceType: String!
  price: Float
  status: Boolean!
  createdAt: String
  updatedAt: String
}

"""
Devuelve una colección de servicios.
"""
type ServiceCollection {
  items: [Service]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

extend type Query {
  services(filters: [FilterInput]): ServiceCollection
  service(id: Int!): Service
  currentService: Service
  currentContactService: Service
  currentContactAction: String
}